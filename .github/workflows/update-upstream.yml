# Check daily for a new Zola release and open a PR that adds it to VERSIONS (scripts/update-upstream.sh).
#
# Every release stays listed. A patch release uses its line's patch series; a new line with no
# patches yet starts with a series reusing the previous line's. The PR says whether the patches
# apply. Its CI run (test.yml) tests the newest release of each line, and merging it triggers
# release.yml, which publishes the new version as a release candidate.
#
# Setup, in the repository's Settings:
# - Actions → General → Workflow permissions: allow GitHub Actions to create pull requests.
# - Optional: a fine-grained token with Contents and Pull requests read/write as the
#   UPDATE_PR_TOKEN secret. PRs opened with the default GITHUB_TOKEN don't trigger other
#   workflows, so without it test.yml won't run on the PR until you push to it.
name: update-upstream

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Zola tag to update to (defaults to the latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-upstream
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}

      - name: Look for a new Zola release
        id: update
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          tag="$(scripts/update-upstream.sh "$INPUT_TAG")" || status=$?
          if [ "$status" = 3 ]; then
            echo "::notice::Already on the latest Zola release ($tag)"
            exit 0
          fi
          [ "$status" = 0 ] || exit "$status"
          branch="update-zola-$tag"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::Branch $branch already exists, so a PR for $tag is already open (or was closed on purpose)"
            exit 0
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      # Only a quick check: the PR's CI does the full build and test
      - name: Check that the patches still apply
        id: patches
        if: steps.update.outputs.tag
        env:
          ZOLA_VERSION: ${{ steps.update.outputs.tag }}
        run: |
          if scripts/setup.sh >setup.log 2>&1; then
            echo "result=applies cleanly" >>"$GITHUB_OUTPUT"
          else
            echo "result=**doesn't apply**" >>"$GITHUB_OUTPUT"
            { echo 'log<<EOF'; tail -n 30 setup.log; echo EOF; } >>"$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.update.outputs.tag
        env:
          TAG: ${{ steps.update.outputs.tag }}
          BRANCH: ${{ steps.update.outputs.branch }}
          PATCHES: ${{ steps.patches.outputs.result }}
          PATCH_LOG: ${{ steps.patches.outputs.log }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add VERSIONS patches
          git commit -m "Update Zola to $TAG"
          git push origin "$BRANCH"

          {
            echo "[Zola $TAG](https://github.com/getzola/zola/releases/tag/$TAG) is out. This adds it to \`VERSIONS\`, the versions zola-wasi releases."
            echo
            echo '```diff'
            git diff HEAD~1 -- VERSIONS | sed -n '/^[-+]v/p'
            echo '```'
            echo
            series="$(ZOLA_VERSION="$TAG" bash -c '. scripts/common.sh && series_dir "$ZOLA_TAG"' | sed "s#^$PWD/##")"
            echo "Its patch series, \`$series/series\`, $PATCHES on $TAG."
            if [ -n "$PATCH_LOG" ]; then
              echo
              echo "To fix them: \`ZOLA_VERSION=$TAG scripts/setup.sh\`, resolve the failing patch with \`git am\` in \`zola/\`, then \`ZOLA_VERSION=$TAG scripts/export-patches.sh\` and push to this branch."
              echo
              echo '```'
              echo "$PATCH_LOG"
              echo '```'
            fi
            echo
            echo "Merging this publishes zola-wasi $TAG as a release candidate (\`release.yml\`)."
            echo "- [Zola changelog](https://github.com/getzola/zola/blob/$TAG/CHANGELOG.md)"
          } >pr-body.md
          gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" --title "Update Zola to $TAG" --body-file pr-body.md
