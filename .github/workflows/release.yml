# Fetch Zola, apply patches/, test, build zola.wasm and publish it as a GitHub release.
#
# Runs when UPSTREAM or patches/ change on main (e.g. after merging an update-upstream PR), and
# on demand. Automatic releases are published as pre-releases (release candidates): promote one
# to a full release in the GitHub UI once you're happy with it.
#
# The release tag is UPSTREAM's ZOLA_TAG, e.g. v0.23.6. To re-release the same Zola version with
# changed patches, run this workflow by hand with a suffixed tag such as v0.23.6-2.
name: release

on:
  push:
    branches: [main]
    paths: [UPSTREAM, patches/**]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Defaults to UPSTREAM's ZOLA_TAG; use e.g. v0.23.6-2 to re-release with new patches
        required: false
      prerelease:
        description: Publish as a pre-release (release candidate)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          . UPSTREAM
          tag="${INPUT_TAG:-$ZOLA_TAG}"
          # The tag must name the Zola release it was built from
          if ! [[ "$tag" =~ ^${ZOLA_TAG//./\\.}(-[0-9]+)?$ ]]; then
            echo "::error::Release tag $tag doesn't match UPSTREAM's $ZOLA_TAG (expected $ZOLA_TAG or $ZOLA_TAG-N)"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::Release $tag already exists. Delete it first, or pass a new tag like $ZOLA_TAG-2"
              exit 1
            fi
            echo "::notice::Release $tag already exists, nothing to do. Run this workflow by hand with a tag like $ZOLA_TAG-2 to re-release."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.tag.outputs.skip != 'true'
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 20

      - uses: actions/cache@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .toolchain
          key: ${{ runner.os }}-${{ hashFiles('UPSTREAM', 'patches/*.patch', 'scripts/toolchain.sh') }}

      # Builds dist/zola.wasm and runs the whole suite against it
      - name: Build and test
        if: steps.tag.outputs.skip != 'true'
        run: scripts/test.sh

      - name: Package
        if: steps.tag.outputs.skip != 'true'
        run: scripts/package.sh

      - name: Publish
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # Automatic releases are always release candidates
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          scripts/release-notes.sh "$TAG" >release-notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "zola-wasi $TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
          echo "::notice::Published $TAG$([ "$PRERELEASE" = true ] && echo ' as a pre-release')"
