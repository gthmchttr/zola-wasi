name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - name: Patch series
        run: scripts/check-series.sh
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      # The newest release of each line in VERSIONS: that covers every patch series without
      # rebuilding every patch release on each push (release.yml tests each one it publishes)
      - name: Versions
        id: versions
        run: |
          . scripts/common.sh
          echo "versions=$(zola_versions | sort -V | awk '{line = $1; sub(/\.[0-9]+$/, "", line); newest[line] = $1} END {for (l in newest) print newest[l]}' | sort -V | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')" >>"$GITHUB_OUTPUT"

  test:
    needs: lint
    # zola.wasm is the same whichever OS builds it, so Linux is enough (release.yml builds there too)
    strategy:
      fail-fast: false
      matrix:
        zola: ${{ fromJSON(needs.lint.outputs.versions) }}
    name: test (${{ matrix.zola }})
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: ${{ matrix.zola }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .toolchain
          key: ${{ runner.os }}-${{ matrix.zola }}-${{ hashFiles('VERSIONS', 'patches/**', 'scripts/toolchain.sh') }}

      - run: scripts/test.sh

      - uses: actions/upload-artifact@v7
        with:
          name: zola-wasm-${{ matrix.zola }}
          path: |
            dist/zola.wasm*
            dist/zola-wasi.js
